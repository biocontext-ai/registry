identifier: InterPro/mcp-server

name: InterPro MCP

description: >
  The InterPro MCP Server exposes the EMBL-EBI InterPro protein classification resource to AI agents over Streamable HTTP. It bridges three complementary services: EBI Search for free-text discovery, the InterPro REST API for authoritative lookups of entries, proteins, GO terms, taxonomy, structures and domain architectures, and the Matches API for fast precomputed sequence-to-domain lookups by MD5. It also runs live InterProScan 6 jobs on the EMBL-EBI Job Dispatcher for novel sequences. Thirteen tools let an agent identify domains from a keyword, annotate UniProt proteins, place families on the tree of life, explore domain architectures, and analysis new sequences.

