identifier: helena-bioinformatics/noodle-mcp

name: Noodle Biomedical Literature Discovery MCP

description: >
  Public, read-only biomedical literature discovery from Helena Bioinformatics. Search a
  PubMed-derived corpus by natural language, PMID, DOI or PMCID; retrieve source-linked
  publication records; and traverse bounded citation or semantic neighborhoods with graph
  provenance. It accepts no patient, private case, clinical-record, credential or uploaded content.

