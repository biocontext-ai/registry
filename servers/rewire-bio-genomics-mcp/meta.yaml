identifier: rewire-bio/genomics-mcp

name: Genomics MCP

description: >
  Local MCP server for bounded genomic data and versioned reference evidence. Discovers
  EGA, ENA, ENCODE, GEO and NCBI Datasets records; reads regions from indexed BAM/CRAM,
  VCF/BCF, FASTA, BED/GFF/GTF and bigWig/bigBed files on local disk, HTTPS or S3; fetches
  files as local artifacts with checksums; and returns HGNC, Ensembl, ClinVar, gnomAD,
  UniProt and Open Targets evidence with provenance. Runs on the user's machine; research
  use only.

codeRepository: https://github.com/rewire-bio/genomics-mcp

