featureList:
  - Archive discovery for EGA, ENA, ENCODE, GEO and NCBI Datasets
  - Bounded reads, coverage, pileup and variants from indexed BAM/CRAM/VCF/BCF
  - Sequence, features and signal from FASTA, BED/GFF/GTF and bigWig/bigBed
  - Checksummed, resumable file transfers to a local workspace
  - Variant normalization and ClinVar, gnomAD, HGNC, Ensembl, UniProt and Open Targets evidence
