identifier: OMOPHub/omophub-mcp

name: OMOPHub MCP Server

description: >
  MCP server for the OHDSI OMOP standardized vocabularies. Search, look up, map and navigate
  11M+ concepts across 120+ vocabularies, including SNOMED CT, ICD-10, RxNorm and LOINC, from
  any AI agent. Supports cross-vocabulary mapping, concept hierarchy navigation and concept set
  building for OMOP CDM ETL, phenotype definitions and observational research. Runs locally via
  npx or as a hosted remote server, and needs an OMOPHub API key (a free plan is available).

