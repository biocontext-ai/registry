identifier: musharna/phylokit-mcp

name: PhyloKit MCP

description: >
  A Model Context Protocol server for phylogenetic inference over IQ-TREE 2 that never returns a
  tree topology without its bootstrap support. It infers maximum-likelihood trees with per-clade
  support, ranks 100+ substitution models by AIC/AICc/BIC and reports when the criteria disagree,
  compares trees by Robinson-Foulds distance on splits (not strings), and simulates alignments
  along a given tree as a positive control, all within enforced size limits.

