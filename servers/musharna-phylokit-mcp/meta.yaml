featureList:
  - Maximum-likelihood tree inference with bootstrap support per clade, always together
  - Substitution model selection over 100+ models with AIC/AICc/BIC deltas and disagreement flagged
  - Tree comparison by Robinson-Foulds distance and the differing clades
  - Alignment simulation along a specified tree (positive control)
  - "Engine capabilities: IQ-TREE version, 215 models, enforced limits"
  - Tested against the real IQ-TREE engine, no mocked runs; published to PyPI
