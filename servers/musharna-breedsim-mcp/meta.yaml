identifier: musharna/breedsim-mcp

name: BreedSim MCP

description: >
  A Model Context Protocol server for breeding-scheme simulation over AlphaSimR that returns
  distributions, never a single stochastic run. It founds populations with measured linkage
  disequilibrium and provenance, runs multi-cycle phenotypic or genomic selection programmes
  reporting per-cycle means, standard deviations and confidence intervals across replicates,
  compares two programmes by their paired difference with an interval, and attaches typed warnings
  (non-reproducible founders, no LD, low prediction accuracy, too few replicates, exhausted
  variance) so a number is never read without its caveat.

