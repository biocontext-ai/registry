featureList:
  - Population founding with generator choice, seed, measured LD and reproducibility provenance
  - Multi-cycle selection programmes (phenotypic or genomic) reported as per-cycle distributions with 95% CIs
  - Paired comparison of two programmes with a confidence interval on the difference
  - Typed warnings for non-determinism, missing LD, low prediction accuracy, few replicates, variance exhaustion
  - Session provenance and trait-architecture description
  - Thread pinning for reproducible seeds; tested against real AlphaSimR; published to PyPI and the official MCP registry
