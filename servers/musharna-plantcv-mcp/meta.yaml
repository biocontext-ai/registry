featureList:
  - Segmentation with contact-sheet suggestions per channel/method, returning the overlay and diagnostics before any trait
  - Mask refinement ops producing a new session with its own overlay
  - Trait measurement (size, shape, colour) with px-per-mm scale from a calibrated marker
  - Per-plant measurement over tray grids, and one recipe across many images
  - Leaf/stem skeleton morphology with a numbered-segment overlay
  - Hyperspectral (ENVI) sessions from spectral-index thresholds with index statistics
  - Thermal sessions from a temperature band with max/min/mean/median under the mask
  - Lens-distortion correction via checkerboard calibration
  - Refuses degenerate masks and unreadable inputs with typed errors instead of numbers
