identifier: musharna/plantcv-mcp

name: PlantCV MCP

description: >
  A Model Context Protocol server that exposes PlantCV as a measurement instrument for plant
  phenotyping. An agent segments an image, is handed back the segmentation overlay it was measured
  from, refines the mask, and only then measures traits (size, shape, colour, morphology/skeleton,
  per-plant tray grids, hyperspectral indices, thermal temperatures), with scale calibration from
  a marker of known size and lens-distortion correction. A degenerate mask raises instead of
  returning numbers, so a trait is never reported without the pixels it came from.

