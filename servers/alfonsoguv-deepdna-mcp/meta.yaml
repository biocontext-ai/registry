identifier: alfonsoguv/deepdna-mcp

name: DeepDNA

description: >
  Cited pharmacogenomic and gene-variant lookups for AI agents. The hosted,
  read-only server needs no API key and has five tools: list the curated genes,
  look up a gene, look up a variant by rsID, look up drug–gene guidance (CPIC or
  DPWG where a guideline exists, otherwise an FDA label or the primary
  literature), and screen a list of generic drug names for curated drug–gene
  records. It is a small, reviewed set, and every record lists its sources. It
  takes no genotype and does not work out a metabolizer status or a dose. The
  repository also holds an MIT-licensed local package (deepdna-mcp on PyPI) that
  reads a 23andMe, AncestryDNA or MyHeritage raw data file on the user's
  computer and reports what it shows at the curated positions. Educational
  information, not medical advice.

