featureList:
  - Evidence summary for one peptide, with studies in people first
  - Search study findings by outcome and evidence class
  - Registered clinical trials with NCT numbers
  - Side-by-side comparison of up to five peptides
  - Doses used in studies, with species and route
  - Approval status and the region of each approval
