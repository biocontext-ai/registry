additionalType:
  - https://schema.org/SoftwareSourceCode

identifier: pepbank/peptide-research-mcp

name: PepBank Peptide Research MCP

description: >
  Read-only peptide research data from PepBank. Look up what studies found about 160+
  peptides, such as BPC-157, retatrutide, tirzepatide and GHK-Cu, with the papers and
  registered clinical trials behind each result. Each finding links to the sentence in the
  paper that supports it and has an evidence class (human, animal, laboratory or predicted).
  Compare up to five peptides, see the doses that studies used, and check where a peptide is
  approved. The data is CC BY 4.0. No account is needed, and it accepts no patient data.

codeRepository: https://github.com/pepbank/peptide-research-mcp

