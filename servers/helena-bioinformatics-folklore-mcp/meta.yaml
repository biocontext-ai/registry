identifier: helena-bioinformatics/folklore-mcp

name: Folklore Clinical Variant Interpretation MCP

description: >
  Helena Bioinformatics MCP for clinical variant interpretation, ACMG/AMP evidence and literature.
  It provides read-only access to public evidence for supported GRCh38 germline nuclear SNVs and
  simple indels, with explicit provenance and professional-review limitations. It accepts no patient,
  phenotype, family, segregation or private case data and does not provide a diagnosis.

